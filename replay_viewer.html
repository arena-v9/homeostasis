<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* All recorded episodes play side by side, like the training videos: each cell is one episode, with the agent's
   health (red) and energy (yellow) bars above its grid. Bars jump once per step, with no animation. */
:root {
  --bg: #ffffff; --ink: #1d2320; --muted: #66706c; --line: #dde2e0; --cell: #fafbfb;
  --wall: #6e6e6e; --floor: #ffffff; --grid: #e1e1e1; --fire: #ff7800; --food: #3cb44b;
  --agent: #285adc; --npc: #963cc8; --health: #dc2828; --energy: #e6be00; --track: #e6e6e6;
  --died: #c43535; --ok: #23824c;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141816; --ink: #e6ece9; --muted: #98a49f; --line: #2c3532; --cell: #1b201e;
  --wall: #555b58; --floor: #262c29; --grid: #323a36; --fire: #ff8c33; --food: #46c25a;
  --agent: #6f98ff; --npc: #c07af0; --health: #ff5c5c; --energy: #ffd23f; --track: #333b37;
  --died: #ff6b6b; --ok: #4fca82; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141816; --ink: #e6ece9; --muted: #98a49f; --line: #2c3532; --cell: #1b201e;
  --wall: #555b58; --floor: #262c29; --grid: #323a36; --fire: #ff8c33; --food: #46c25a;
  --agent: #6f98ff; --npc: #c07af0; --health: #ff5c5c; --energy: #ffd23f; --track: #333b37;
  --died: #ff6b6b; --ok: #4fca82; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-size: 1.3rem; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; line-height: 1.45; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.controls input[type=range] { flex: 1 1 180px; min-width: 0; accent-color: var(--agent); }
select, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button { min-width: 4.5rem; }
.num { font-variant-numeric: tabular-nums; color: var(--muted); }
canvas { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; display: block; border: 1px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 0.85rem; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 11px; height: 11px; display: inline-block; }
</style>

<div class="wrap">
  <h1 id="title"></h1>
  <p id="subtitle" class="sub"></p>
  <div class="controls">
    <select id="checkpoint" aria-label="Training stage"></select>
    <button id="play">Play</button>
    <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Step">
    <span id="step" class="num"></span>
    <select id="speed" aria-label="Playback speed">
      <option value="2">slow</option><option value="6" selected>normal</option><option value="20">fast</option>
    </select>
  </div>
  <span id="summary" class="num"></span>
  <canvas id="view" aria-label="All episodes at the current step"></canvas>
  <div class="legend">
    <span><i style="background:var(--health)"></i>Health</span>
    <span><i style="background:var(--energy)"></i>Energy</span>
    <span><i style="background:var(--agent);border-radius:50%"></i>Agent</span>
    <span><i style="background:var(--npc);border-radius:50%"></i>NPC</span>
    <span><i style="background:var(--food)"></i>Food</span>
    <span><i style="background:var(--fire)"></i>Fire</span>
    <span><i style="background:var(--wall)"></i>Wall</span>
  </div>
</div>

<script>
const DATA = __DATA__;
const T = DATA.tiles;
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
let cp = DATA.checkpoints.length - 1, frame = 0, timer = null;

$("title").textContent = DATA.title;
$("subtitle").textContent = DATA.subtitle;
DATA.checkpoints.forEach((c, i) => $("checkpoint").add(new Option(c.label, i)));
$("checkpoint").value = cp;

const episodes = () => DATA.checkpoints[cp].episodes;
const longest = () => Math.max(...episodes().map((e) => e.frames.length)) - 1;

// One cell: two bars on top, then the grid. An episode that has ended stays on its last frame with a label.
function drawCell(ctx, ep, x0, y0, w, h, c) {
  const last = ep.frames.length - 1, f = ep.frames[Math.min(frame, last)], ended = frame >= last;
  const barH = Math.round(h * 0.07), gap = 3;
  [[f.h, c.health], [f.e, c.energy]].forEach(([v, col], k) => {
    const y = y0 + 4 + k * (barH + gap);
    ctx.fillStyle = c.track; ctx.fillRect(x0 + 4, y, w - 8, barH);
    ctx.fillStyle = col; ctx.fillRect(x0 + 4, y, (w - 8) * Math.max(0, Math.min(1, v)), barH);
  });
  const top = y0 + 4 + 2 * (barH + gap) + 2, n = ep.tiles.length;
  const sq = Math.floor(Math.min(w - 8, y0 + h - 4 - top) / n), gx = x0 + (w - sq * n) / 2;
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) {
    const tile = ep.tiles[r][col];
    ctx.fillStyle = tile === T.wall ? c.wall : tile === T.fire ? c.fire : c.floor;
    ctx.fillRect(gx + col * sq, top + r * sq, sq, sq);
    ctx.strokeStyle = c.grid; ctx.strokeRect(gx + col * sq + 0.5, top + r * sq + 0.5, sq - 1, sq - 1);
  }
  for (const [r, col] of f.food) { ctx.fillStyle = c.food; ctx.fillRect(gx + col * sq, top + r * sq, sq, sq); }
  const body = (r, col, color) => {
    ctx.fillStyle = color; ctx.beginPath();
    ctx.arc(gx + col * sq + sq / 2, top + r * sq + sq / 2, sq / 3, 0, Math.PI * 2); ctx.fill();
  };
  if (f.npc) body(f.npc[0], f.npc[1], c.npc);
  body(f.agent[0], f.agent[1], c.agent);
  if (ended) {
    const died = ep.outcome === "died";
    const text = died ? `died at step ${last}` : ep.outcome;
    ctx.font = `600 ${Math.max(11, Math.round(sq * 0.55))}px system-ui, sans-serif`;
    const tw = ctx.measureText(text).width, ty = top + (sq * n) / 2;
    ctx.fillStyle = c.bg; ctx.globalAlpha = 0.85;
    ctx.fillRect(x0 + (w - tw) / 2 - 6, ty - sq * 0.45, tw + 12, sq * 0.9); ctx.globalAlpha = 1;
    ctx.fillStyle = died ? c.died : c.ok; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, x0 + w / 2, ty); ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
  }
}

function draw() {
  const cv = $("view"), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const c = Object.fromEntries(["bg", "cell", "line", "wall", "floor", "grid", "fire", "food", "agent", "npc",
    "health", "energy", "track", "died", "ok"].map((k) => [k, css(`--${k}`)]));
  ctx.fillStyle = c.bg; ctx.fillRect(0, 0, W, H);
  const eps = episodes(), cols = Math.ceil(Math.sqrt(eps.length)), rows = Math.ceil(eps.length / cols);
  const cw = W / cols, ch = H / rows;
  eps.forEach((ep, i) => {
    const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
    ctx.fillStyle = c.cell; ctx.fillRect(x, y, cw, ch);
    ctx.strokeStyle = c.line; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
    drawCell(ctx, ep, x, y, cw, ch, c);
  });
  $("scrub").max = longest(); $("scrub").value = frame;
  $("step").textContent = `step ${frame} / ${longest()}`;
  const survived = eps.filter((e) => e.outcome === "survived").length;
  $("summary").textContent = `${survived} of ${eps.length} episodes survived`;
}

function setPlaying(on) {
  clearInterval(timer); timer = null;
  $("play").textContent = on ? "Pause" : "Play";
  if (!on) return;
  if (frame >= longest()) frame = 0;
  timer = setInterval(() => { if (frame >= longest()) return setPlaying(false); frame++; draw(); },
    1000 / Number($("speed").value));
}

$("checkpoint").onchange = (e) => { cp = Number(e.target.value); frame = 0; setPlaying(false); draw(); };
$("play").onclick = () => setPlaying(!timer);
$("scrub").oninput = (e) => { setPlaying(false); frame = Number(e.target.value); draw(); };
$("speed").onchange = () => { if (timer) setPlaying(true); };
document.addEventListener("keydown", (e) => {
  if (e.key === " " && document.activeElement.tagName !== "SELECT") { e.preventDefault(); setPlaying(!timer); }
  else if (e.key === "ArrowRight") { setPlaying(false); frame = Math.min(longest(), frame + 1); draw(); }
  else if (e.key === "ArrowLeft") { setPlaying(false); frame = Math.max(0, frame - 1); draw(); }
});
window.addEventListener("resize", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
draw();
</script>
