<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridworld Runs</title>
<style>
/* Pick a training run, see its learning curves, then its replays. In the replays all recorded episodes play side by
   side, like the training videos: each cell is one episode, with the agent's health (red) and energy (yellow) bars
   above its grid. Bars jump once per step, with no animation. */
:root {
  --bg: #ffffff; --ink: #1d2320; --muted: #66706c; --line: #dde2e0; --cell: #fafbfb;
  --wall: #6e6e6e; --floor: #ffffff; --grid: #e1e1e1; --fire: #ff7800; --food: #3cb44b;
  --agent: #285adc; --npc: #963cc8; --health: #dc2828; --energy: #e6be00; --track: #e6e6e6;
  --died: #c43535; --ok: #23824c;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141816; --ink: #e6ece9; --muted: #98a49f; --line: #2c3532; --cell: #1b201e;
  --wall: #555b58; --floor: #262c29; --grid: #323a36; --fire: #ff8c33; --food: #46c25a;
  --agent: #6f98ff; --npc: #c07af0; --health: #ff5c5c; --energy: #ffd23f; --track: #333b37;
  --died: #ff6b6b; --ok: #4fca82; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141816; --ink: #e6ece9; --muted: #98a49f; --line: #2c3532; --cell: #1b201e;
  --wall: #555b58; --floor: #262c29; --grid: #323a36; --fire: #ff8c33; --food: #46c25a;
  --agent: #6f98ff; --npc: #c07af0; --health: #ff5c5c; --energy: #ffd23f; --track: #333b37;
  --died: #ff6b6b; --ok: #4fca82; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-size: 1.3rem; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; line-height: 1.45; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.controls input[type=range] { flex: 1 1 180px; min-width: 0; accent-color: var(--agent); }
select, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button { min-width: 4.5rem; }
.num { font-variant-numeric: tabular-nums; color: var(--muted); }
canvas { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; display: block; border: 1px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 0.85rem; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 11px; height: 11px; display: inline-block; }
h2 { margin: 14px 0 0; font-size: 1.05rem; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
@media (max-width: 560px) { .charts { grid-template-columns: minmax(0, 1fr); } }
.chart { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chart .head { font-size: 0.85rem; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-size: 10px; fill: var(--muted); font-variant-numeric: tabular-nums; }
</style>

<div class="wrap">
  <h1>Gridworld Runs</h1>
  <p id="load-msg" class="sub" hidden></p>
  <div id="viewer" hidden style="display:contents">
  <div class="controls">
    <select id="run" aria-label="Training run"></select>
  </div>
  <p id="subtitle" class="sub"></p>
  <span id="run-info" class="num"></span>

  <h2>Replays</h2>
  <div class="controls">
    <select id="checkpoint" aria-label="Training stage"></select>
    <button id="play">Play</button>
    <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Step">
    <span id="step" class="num"></span>
    <select id="speed" aria-label="Playback speed">
      <option value="2">slow</option><option value="6" selected>normal</option><option value="20">fast</option>
    </select>
  </div>
  <span id="summary" class="num"></span>
  <canvas id="view" aria-label="All episodes at the current step"></canvas>
  <div class="legend">
    <span><i style="background:var(--health)"></i>Health</span>
    <span><i style="background:var(--energy)"></i>Energy</span>
    <span><i style="background:var(--agent);border-radius:50%"></i>Agent</span>
    <span><i style="background:var(--npc);border-radius:50%"></i>NPC</span>
    <span><i style="background:var(--food)"></i>Food</span>
    <span><i style="background:var(--fire)"></i>Fire</span>
    <span><i style="background:var(--wall)"></i>Wall</span>
  </div>

  <h2>Learning curves</h2>
  <p class="sub">Greedy policy on 64 fixed layouts, evaluated during training. Dashed line: random policy.</p>
  <div id="charts" class="charts"></div>
  </div>
</div>

<script>
// Reads outputs/runs.json (the list of runs) and, for the chosen run, outputs/runs/<name>/run.json, curves.json and
// replay.json. See runs/outputs.py and runs/recording.py for their layouts. The chosen run is kept in the address
// (#<run name>).

// ---- State ----------------------------------------------------------------------------------------------------------

const $ = (id) => document.getElementById(id);
const cssColor = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const COLOR_NAMES = ["bg", "cell", "line", "wall", "floor", "grid", "fire", "food", "agent", "npc", "health", "energy",
  "track", "died", "ok"];

let runList = [];         // entries of runs.json
let currentRun = null;    // name of the run being shown
let replay = null;        // the current run's replay.json
let checkpointIndex = 0;  // which training stage's episodes are playing
let frameIndex = 0;       // the step shown in every episode
let playTimer = null;     // setInterval handle while playing

const episodes = () => replay.checkpoints[checkpointIndex].episodes;
const lastFrameIndex = () => Math.max(...episodes().map((episode) => episode.frames.length)) - 1;

// ---- Loading --------------------------------------------------------------------------------------------------------

const getJson = (url) => fetch(url).then((response) => {
  if (!response.ok) throw new Error(`${url}: ${response.status} ${response.statusText}`);
  return response.json();
});

function showError(message) {
  $("load-msg").textContent = message;
  $("load-msg").hidden = false;
}

async function loadRun(name) {
  setPlaying(false);
  currentRun = name;
  $("run").value = name;
  try {
    const runFolder = `outputs/runs/${encodeURIComponent(name)}/`;
    const [info, curves, runReplay] = await Promise.all(
      ["run", "curves", "replay"].map((file) => getJson(`${runFolder}${file}.json`)));
    if (currentRun !== name) return;  // another run was picked while this one loaded
    $("load-msg").hidden = true;
    showRunInfo(info);
    drawCharts(curves);
    replay = runReplay;
    checkpointIndex = replay.checkpoints.length - 1;
    frameIndex = 0;
    $("checkpoint").replaceChildren();
    replay.checkpoints.forEach((checkpoint, index) => $("checkpoint").add(new Option(checkpoint.label, index)));
    $("checkpoint").value = checkpointIndex;
    drawReplay();
  } catch (error) {
    showError(`Couldn't load run ${name} (${error.message}).`);
  }
}

function showRunInfo(info) {
  const format = (value) => (Number.isInteger(value) ? value : value.toFixed(2));
  $("subtitle").textContent = info.summary || "";
  $("run-info").textContent = [
    `created ${info.created}`,
    info.train_seconds != null && `trained in ${Math.round(info.train_seconds / 60)} min`,
    info.final && `final survival ${format(info.final.survival)} (random ${format(info.random.survival)})`,
  ].filter(Boolean).join(" · ");
}

// ---- Learning curves ------------------------------------------------------------------------------------------------

// One small line chart per metric: the greedy policy over training, and the random policy as a dashed line.
function drawCharts(curves) {
  const SVG_NAMESPACE = "http://www.w3.org/2000/svg";
  const WIDTH = 320, HEIGHT = 130, PADDING = { left: 34, right: 8, top: 6, bottom: 16 };
  const addSvg = (tag, attributes, parent) => {
    const element = document.createElementNS(SVG_NAMESPACE, tag);
    for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, value);
    parent.append(element);
    return element;
  };
  const container = $("charts");
  container.replaceChildren();
  const envSteps = curves.history.map((evaluation) => evaluation.env_steps);
  const maxEnvSteps = Math.max(...envSteps, 1);

  for (const [metric, label] of Object.entries(curves.metrics)) {
    const values = curves.history.map((evaluation) => evaluation[metric]);
    const randomValue = curves.random[metric];
    let low = Math.min(...values, randomValue), high = Math.max(...values, randomValue);
    if (metric === "survival") { low = 0; high = 1; }
    if (high === low) high = low + 1;
    const toX = (steps) => PADDING.left + (WIDTH - PADDING.left - PADDING.right) * (steps / maxEnvSteps);
    const toY = (value) => PADDING.top + (HEIGHT - PADDING.top - PADDING.bottom) * (1 - (value - low) / (high - low));

    const chart = document.createElement("div");
    chart.className = "chart";
    const heading = document.createElement("div");
    heading.className = "head";
    heading.innerHTML = `<span></span><span class="num"></span>`;
    heading.children[0].textContent = label;
    const finalValue = values[values.length - 1];
    heading.children[1].textContent = `final ${finalValue.toFixed(2)} · random ${randomValue.toFixed(2)}`;
    chart.append(heading);

    const svg = addSvg("svg", { viewBox: `0 0 ${WIDTH} ${HEIGHT}`, role: "img", "aria-label": label }, chart);
    const right = WIDTH - PADDING.right;
    for (const value of [low, high]) {
      addSvg("line", { x1: PADDING.left, x2: right, y1: toY(value), y2: toY(value), style: "stroke:var(--line)" }, svg);
      const axisLabel = addSvg("text", { x: PADDING.left - 4, y: toY(value) + 3, "text-anchor": "end" }, svg);
      axisLabel.textContent = +value.toFixed(2);
    }
    addSvg("text", { x: PADDING.left, y: HEIGHT - 3 }, svg).textContent = "0";
    addSvg("text", { x: right, y: HEIGHT - 3, "text-anchor": "end" }, svg).textContent =
      `${Math.round(maxEnvSteps / 1000)}k env steps`;
    addSvg("line", { x1: PADDING.left, x2: right, y1: toY(randomValue), y2: toY(randomValue),
                     style: "stroke:var(--muted);stroke-dasharray:4 3" }, svg);
    addSvg("polyline", { points: envSteps.map((steps, index) => `${toX(steps)},${toY(values[index])}`).join(" "),
                         style: "fill:none;stroke:var(--agent);stroke-width:1.5" }, svg);
    container.append(chart);
  }
}

// ---- Replays --------------------------------------------------------------------------------------------------------

// One episode's cell: health and energy bars on top, then the grid. An episode that has ended stays on its last frame
// with a label.
function drawEpisode(context, episode, cellX, cellY, cellWidth, cellHeight, colors) {
  const lastFrame = episode.frames.length - 1;
  const frame = episode.frames[Math.min(frameIndex, lastFrame)];
  const MARGIN = 4, BAR_GAP = 3, barHeight = Math.round(cellHeight * 0.07);

  [[frame.agent.health, colors.health], [frame.agent.energy, colors.energy]].forEach(([value, color], row) => {
    const barY = cellY + MARGIN + row * (barHeight + BAR_GAP);
    const barWidth = cellWidth - 2 * MARGIN;
    context.fillStyle = colors.track;
    context.fillRect(cellX + MARGIN, barY, barWidth, barHeight);
    context.fillStyle = color;
    context.fillRect(cellX + MARGIN, barY, barWidth * Math.max(0, Math.min(1, value)), barHeight);
  });

  const gridTop = cellY + MARGIN + 2 * (barHeight + BAR_GAP) + 2;
  const gridSize = episode.tiles.length;
  const square = Math.floor(Math.min(cellWidth - 2 * MARGIN, cellY + cellHeight - MARGIN - gridTop) / gridSize);
  const gridLeft = cellX + (cellWidth - square * gridSize) / 2;
  const squareX = (col) => gridLeft + col * square, squareY = (row) => gridTop + row * square;

  for (let row = 0; row < gridSize; row++) {
    for (let col = 0; col < gridSize; col++) {
      const tile = episode.tiles[row][col];
      const isWall = tile === replay.tiles.wall, isFire = tile === replay.tiles.fire;
      context.fillStyle = isWall ? colors.wall : isFire ? colors.fire : colors.floor;
      context.fillRect(squareX(col), squareY(row), square, square);
      context.strokeStyle = colors.grid;
      context.strokeRect(squareX(col) + 0.5, squareY(row) + 0.5, square - 1, square - 1);
    }
  }
  for (const [row, col] of frame.food) {
    context.fillStyle = colors.food;
    context.fillRect(squareX(col), squareY(row), square, square);
  }
  const drawBody = ([row, col], color) => {
    context.fillStyle = color;
    context.beginPath();
    context.arc(squareX(col) + square / 2, squareY(row) + square / 2, square / 3, 0, Math.PI * 2);
    context.fill();
  };
  if (frame.npc) drawBody(frame.npc.pos, colors.npc);
  drawBody(frame.agent.pos, colors.agent);

  if (frameIndex >= lastFrame) {
    const died = episode.outcome === "died";
    const text = died ? `died at step ${lastFrame}` : episode.outcome;
    context.font = `600 ${Math.max(11, Math.round(square * 0.55))}px system-ui, sans-serif`;
    const textWidth = context.measureText(text).width, textY = gridTop + (square * gridSize) / 2;
    context.fillStyle = colors.bg;
    context.globalAlpha = 0.85;
    context.fillRect(cellX + (cellWidth - textWidth) / 2 - 6, textY - square * 0.45, textWidth + 12, square * 0.9);
    context.globalAlpha = 1;
    context.fillStyle = died ? colors.died : colors.ok;
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.fillText(text, cellX + cellWidth / 2, textY);
    context.textAlign = "start";
    context.textBaseline = "alphabetic";
  }
}

// All episodes of the current training stage, side by side, at the current step.
function drawReplay() {
  if (!replay) return;
  const canvas = $("view"), pixelRatio = window.devicePixelRatio || 1;
  const width = canvas.clientWidth, height = canvas.clientHeight;
  canvas.width = width * pixelRatio;
  canvas.height = height * pixelRatio;
  const context = canvas.getContext("2d");
  context.scale(pixelRatio, pixelRatio);
  const colors = Object.fromEntries(COLOR_NAMES.map((name) => [name, cssColor(`--${name}`)]));
  context.fillStyle = colors.bg;
  context.fillRect(0, 0, width, height);

  const shown = episodes();
  const columns = Math.ceil(Math.sqrt(shown.length)), rows = Math.ceil(shown.length / columns);
  const cellWidth = width / columns, cellHeight = height / rows;
  shown.forEach((episode, index) => {
    const cellX = (index % columns) * cellWidth, cellY = Math.floor(index / columns) * cellHeight;
    context.fillStyle = colors.cell;
    context.fillRect(cellX, cellY, cellWidth, cellHeight);
    context.strokeStyle = colors.line;
    context.lineWidth = 1;
    context.strokeRect(cellX + 0.5, cellY + 0.5, cellWidth - 1, cellHeight - 1);
    drawEpisode(context, episode, cellX, cellY, cellWidth, cellHeight, colors);
  });

  $("scrub").max = lastFrameIndex();
  $("scrub").value = frameIndex;
  $("step").textContent = `step ${frameIndex} / ${lastFrameIndex()}`;
  const survived = shown.filter((episode) => episode.outcome === "survived").length;
  $("summary").textContent = `${survived} of ${shown.length} episodes survived`;
}

// ---- Playback and controls ------------------------------------------------------------------------------------------

function setPlaying(on) {
  clearInterval(playTimer);
  playTimer = null;
  $("play").textContent = on ? "Pause" : "Play";
  if (!on) return;
  if (frameIndex >= lastFrameIndex()) frameIndex = 0;
  playTimer = setInterval(() => {
    if (frameIndex >= lastFrameIndex()) return setPlaying(false);
    frameIndex++;
    drawReplay();
  }, 1000 / Number($("speed").value));
}

function showFrame(index) {
  setPlaying(false);
  frameIndex = Math.max(0, Math.min(lastFrameIndex(), index));
  drawReplay();
}

$("run").onchange = (event) => { location.hash = encodeURIComponent(event.target.value); };
window.addEventListener("hashchange", () => {
  const name = decodeURIComponent(location.hash.slice(1));
  if (runList.some((run) => run.name === name) && name !== currentRun) loadRun(name);
});
$("checkpoint").onchange = (event) => {
  checkpointIndex = Number(event.target.value);
  showFrame(0);
};
$("play").onclick = () => setPlaying(!playTimer);
$("scrub").oninput = (event) => showFrame(Number(event.target.value));
$("speed").onchange = () => { if (playTimer) setPlaying(true); };
document.addEventListener("keydown", (event) => {
  if (!replay) return;
  if (event.key === " " && document.activeElement.tagName !== "SELECT") {
    event.preventDefault();
    setPlaying(!playTimer);
  } else if (event.key === "ArrowRight") {
    showFrame(frameIndex + 1);
  } else if (event.key === "ArrowLeft") {
    showFrame(frameIndex - 1);
  }
});
window.addEventListener("resize", drawReplay);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawReplay);
const themeObserver = new MutationObserver(drawReplay);
themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// ---- Start ----------------------------------------------------------------------------------------------------------

getJson("outputs/runs.json")
  .then((runs) => {
    runList = runs;
    if (!runs.length) return showError("No runs yet. Train one with train_gridworld.py.");
    runs.forEach((run) => $("run").add(new Option(run.title ? `${run.title} (${run.name})` : run.name, run.name)));
    $("viewer").hidden = false;
    const requested = decodeURIComponent(location.hash.slice(1));
    loadRun(runs.some((run) => run.name === requested) ? requested : runs[0].name);
  })
  .catch((error) => showError(`Couldn't load the list of runs (${error.message}). Pages opened straight from disk ` +
    "can't load files: serve the ui folder (`cd ui && python -m http.server 8000`) and open http://localhost:8000/."));
</script>
