<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridworld Runs</title>
<style>
/* Pick a training run, see its learning curves, then its replays. In the replays all recorded episodes play side by
   side, like the training videos: each cell is one episode, with the agent's health (red) and energy (yellow) bars
   above its grid. Bars jump once per step, with no animation. */
:root {
  --bg: #ffffff; --ink: #1d2320; --muted: #66706c; --line: #dde2e0; --cell: #fafbfb;
  --wall: #6e6e6e; --floor: #ffffff; --grid: #e1e1e1; --fire: #ff7800; --food: #3cb44b;
  --agent: #285adc; --npc: #963cc8; --health: #dc2828; --energy: #e6be00; --track: #e6e6e6;
  --died: #c43535; --ok: #23824c;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141816; --ink: #e6ece9; --muted: #98a49f; --line: #2c3532; --cell: #1b201e;
  --wall: #555b58; --floor: #262c29; --grid: #323a36; --fire: #ff8c33; --food: #46c25a;
  --agent: #6f98ff; --npc: #c07af0; --health: #ff5c5c; --energy: #ffd23f; --track: #333b37;
  --died: #ff6b6b; --ok: #4fca82; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141816; --ink: #e6ece9; --muted: #98a49f; --line: #2c3532; --cell: #1b201e;
  --wall: #555b58; --floor: #262c29; --grid: #323a36; --fire: #ff8c33; --food: #46c25a;
  --agent: #6f98ff; --npc: #c07af0; --health: #ff5c5c; --energy: #ffd23f; --track: #333b37;
  --died: #ff6b6b; --ok: #4fca82; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-size: 1.3rem; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; line-height: 1.45; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.controls input[type=range] { flex: 1 1 180px; min-width: 0; accent-color: var(--agent); }
select, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button { min-width: 4.5rem; }
.num { font-variant-numeric: tabular-nums; color: var(--muted); }
canvas { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; display: block; border: 1px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 0.85rem; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 11px; height: 11px; display: inline-block; }
h2 { margin: 14px 0 0; font-size: 1.05rem; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
@media (max-width: 560px) { .charts { grid-template-columns: minmax(0, 1fr); } }
.chart { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chart .head { font-size: 0.85rem; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-size: 10px; fill: var(--muted); font-variant-numeric: tabular-nums; }
</style>

<div class="wrap">
  <h1>Gridworld Runs</h1>
  <p id="load-msg" class="sub" hidden></p>
  <div id="viewer" hidden style="display:contents">
  <div class="controls">
    <select id="run" aria-label="Training run"></select>
  </div>
  <p id="subtitle" class="sub"></p>
  <span id="run-info" class="num"></span>

  <h2>Replays</h2>
  <div class="controls">
    <select id="checkpoint" aria-label="Training stage"></select>
    <button id="play">Play</button>
    <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Step">
    <span id="step" class="num"></span>
    <select id="speed" aria-label="Playback speed">
      <option value="2">slow</option><option value="6" selected>normal</option><option value="20">fast</option>
    </select>
  </div>
  <span id="summary" class="num"></span>
  <canvas id="view" aria-label="All episodes at the current step"></canvas>
  <div class="legend">
    <span><i style="background:var(--health)"></i>Health</span>
    <span><i style="background:var(--energy)"></i>Energy</span>
    <span><i style="background:var(--agent);border-radius:50%"></i>Agent</span>
    <span><i style="background:var(--npc);border-radius:50%"></i>NPC</span>
    <span><i style="background:var(--food)"></i>Food</span>
    <span><i style="background:var(--fire)"></i>Fire</span>
    <span><i style="background:var(--wall)"></i>Wall</span>
  </div>

  <h2>Learning curves</h2>
  <p class="sub">Greedy policy on 64 fixed layouts, evaluated during training. Dashed line: random policy.</p>
  <div id="charts" class="charts"></div>
  </div>
</div>

<script>
// Reads outputs/runs.json (the list of runs) and, for the chosen run, outputs/runs/<name>/run.json, curves.json and
// replay.json.
// See runs/outputs.py and runs/recording.py for their layouts. The chosen run is kept in the address (#<run name>).
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
let RUNS = [], current = null, DATA = null, T = null, cp = 0, frame = 0, timer = null;

const getJson = (url) => fetch(url).then((res) => {
  if (!res.ok) throw new Error(`${url}: ${res.status} ${res.statusText}`);
  return res.json();
});

function showError(message) {
  $("load-msg").textContent = message;
  $("load-msg").hidden = false;
}

async function loadRun(name) {
  setPlaying(false);
  current = name;
  $("run").value = name;
  try {
    const base = `outputs/runs/${encodeURIComponent(name)}/`;
    const [info, curves, replay] = await Promise.all(["run", "curves", "replay"].map((f) => getJson(base + f + ".json")));
    if (current !== name) return;  // another run was picked while this one loaded
    $("load-msg").hidden = true;
    $("subtitle").textContent = info.summary || "";
    const fmt = (v) => (Number.isInteger(v) ? v : v.toFixed(2));
    $("run-info").textContent = [
      `created ${info.created}`,
      info.train_seconds != null && `trained in ${Math.round(info.train_seconds / 60)} min`,
      info.final && `final survival ${fmt(info.final.survival)} (random ${fmt(info.random.survival)})`,
    ].filter(Boolean).join(" · ");
    drawCharts(curves);
    DATA = replay; T = replay.tiles; cp = replay.checkpoints.length - 1; frame = 0;
    $("checkpoint").replaceChildren();
    replay.checkpoints.forEach((c, i) => $("checkpoint").add(new Option(c.label, i)));
    $("checkpoint").value = cp;
    draw();
  } catch (err) {
    showError(`Couldn't load run ${name} (${err.message}).`);
  }
}

// One small line chart per metric: the greedy policy over training, and the random policy as a dashed line.
function drawCharts(curves) {
  const box = $("charts"), NS = "http://www.w3.org/2000/svg";
  box.replaceChildren();
  const xs = curves.history.map((h) => h.env_steps), xMax = Math.max(...xs, 1);
  const W = 320, H = 130, pad = { l: 34, r: 8, t: 6, b: 16 };
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    parent.append(e); return e;
  };
  for (const [key, label] of Object.entries(curves.metrics)) {
    const ys = curves.history.map((h) => h[key]), base = curves.random[key];
    let lo = Math.min(...ys, base), hi = Math.max(...ys, base);
    if (key === "survival") { lo = 0; hi = 1; }
    if (hi === lo) hi = lo + 1;
    const X = (x) => pad.l + (W - pad.l - pad.r) * (x / xMax);
    const Y = (y) => pad.t + (H - pad.t - pad.b) * (1 - (y - lo) / (hi - lo));
    const div = document.createElement("div"); div.className = "chart";
    const head = document.createElement("div"); head.className = "head";
    const last = ys[ys.length - 1];
    head.innerHTML = `<span></span><span class="num"></span>`;
    head.children[0].textContent = label;
    head.children[1].textContent = `final ${last.toFixed(2)} · random ${base.toFixed(2)}`;
    div.append(head);
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": label }, div);
    for (const v of [lo, hi]) {
      el("line", { x1: pad.l, x2: W - pad.r, y1: Y(v), y2: Y(v), style: "stroke:var(--line)" }, svg);
      el("text", { x: pad.l - 4, y: Y(v) + 3, "text-anchor": "end" }, svg).textContent = +v.toFixed(2);
    }
    el("text", { x: pad.l, y: H - 3 }, svg).textContent = "0";
    el("text", { x: W - pad.r, y: H - 3, "text-anchor": "end" }, svg).textContent = `${Math.round(xMax / 1000)}k env steps`;
    el("line", { x1: pad.l, x2: W - pad.r, y1: Y(base), y2: Y(base),
                 style: "stroke:var(--muted);stroke-dasharray:4 3" }, svg);
    el("polyline", { points: xs.map((x, i) => `${X(x)},${Y(ys[i])}`).join(" "),
                     style: "fill:none;stroke:var(--agent);stroke-width:1.5" }, svg);
    box.append(div);
  }
}

getJson("outputs/runs.json")
  .then((runs) => {
    RUNS = runs;
    if (!runs.length) return showError("No runs yet. Train one with train_gridworld_solo.py.");
    runs.forEach((r) => $("run").add(new Option(r.title ? `${r.title} (${r.name})` : r.name, r.name)));
    $("viewer").hidden = false;
    const wanted = decodeURIComponent(location.hash.slice(1));
    loadRun(runs.some((r) => r.name === wanted) ? wanted : runs[0].name);
  })
  .catch((err) => showError(`Couldn't load the list of runs (${err.message}). Pages opened straight from disk can't ` +
    "load files: serve the ui folder (`cd ui && python -m http.server 8000`) and open http://localhost:8000/."));
$("run").onchange = (e) => { location.hash = encodeURIComponent(e.target.value); };
window.addEventListener("hashchange", () => {
  const name = decodeURIComponent(location.hash.slice(1));
  if (RUNS.some((r) => r.name === name) && name !== current) loadRun(name);
});

const episodes = () => DATA.checkpoints[cp].episodes;
const longest = () => Math.max(...episodes().map((e) => e.frames.length)) - 1;

// One cell: two bars on top, then the grid. An episode that has ended stays on its last frame with a label.
function drawCell(ctx, ep, x0, y0, w, h, c) {
  const last = ep.frames.length - 1, f = ep.frames[Math.min(frame, last)], ended = frame >= last;
  const barH = Math.round(h * 0.07), gap = 3;
  [[f.agent.health, c.health], [f.agent.energy, c.energy]].forEach(([v, col], k) => {
    const y = y0 + 4 + k * (barH + gap);
    ctx.fillStyle = c.track; ctx.fillRect(x0 + 4, y, w - 8, barH);
    ctx.fillStyle = col; ctx.fillRect(x0 + 4, y, (w - 8) * Math.max(0, Math.min(1, v)), barH);
  });
  const top = y0 + 4 + 2 * (barH + gap) + 2, n = ep.tiles.length;
  const sq = Math.floor(Math.min(w - 8, y0 + h - 4 - top) / n), gx = x0 + (w - sq * n) / 2;
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) {
    const tile = ep.tiles[r][col];
    ctx.fillStyle = tile === T.wall ? c.wall : tile === T.fire ? c.fire : c.floor;
    ctx.fillRect(gx + col * sq, top + r * sq, sq, sq);
    ctx.strokeStyle = c.grid; ctx.strokeRect(gx + col * sq + 0.5, top + r * sq + 0.5, sq - 1, sq - 1);
  }
  for (const [r, col] of f.food) { ctx.fillStyle = c.food; ctx.fillRect(gx + col * sq, top + r * sq, sq, sq); }
  const body = (r, col, color) => {
    ctx.fillStyle = color; ctx.beginPath();
    ctx.arc(gx + col * sq + sq / 2, top + r * sq + sq / 2, sq / 3, 0, Math.PI * 2); ctx.fill();
  };
  if (f.npc) body(f.npc.pos[0], f.npc.pos[1], c.npc);
  body(f.agent.pos[0], f.agent.pos[1], c.agent);
  if (ended) {
    const died = ep.outcome === "died";
    const text = died ? `died at step ${last}` : ep.outcome;
    ctx.font = `600 ${Math.max(11, Math.round(sq * 0.55))}px system-ui, sans-serif`;
    const tw = ctx.measureText(text).width, ty = top + (sq * n) / 2;
    ctx.fillStyle = c.bg; ctx.globalAlpha = 0.85;
    ctx.fillRect(x0 + (w - tw) / 2 - 6, ty - sq * 0.45, tw + 12, sq * 0.9); ctx.globalAlpha = 1;
    ctx.fillStyle = died ? c.died : c.ok; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, x0 + w / 2, ty); ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
  }
}

function draw() {
  if (!DATA) return;
  const cv = $("view"), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const c = Object.fromEntries(["bg", "cell", "line", "wall", "floor", "grid", "fire", "food", "agent", "npc",
    "health", "energy", "track", "died", "ok"].map((k) => [k, css(`--${k}`)]));
  ctx.fillStyle = c.bg; ctx.fillRect(0, 0, W, H);
  const eps = episodes(), cols = Math.ceil(Math.sqrt(eps.length)), rows = Math.ceil(eps.length / cols);
  const cw = W / cols, ch = H / rows;
  eps.forEach((ep, i) => {
    const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
    ctx.fillStyle = c.cell; ctx.fillRect(x, y, cw, ch);
    ctx.strokeStyle = c.line; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
    drawCell(ctx, ep, x, y, cw, ch, c);
  });
  $("scrub").max = longest(); $("scrub").value = frame;
  $("step").textContent = `step ${frame} / ${longest()}`;
  const survived = eps.filter((e) => e.outcome === "survived").length;
  $("summary").textContent = `${survived} of ${eps.length} episodes survived`;
}

function setPlaying(on) {
  clearInterval(timer); timer = null;
  $("play").textContent = on ? "Pause" : "Play";
  if (!on) return;
  if (frame >= longest()) frame = 0;
  timer = setInterval(() => { if (frame >= longest()) return setPlaying(false); frame++; draw(); },
    1000 / Number($("speed").value));
}

$("checkpoint").onchange = (e) => { cp = Number(e.target.value); frame = 0; setPlaying(false); draw(); };
$("play").onclick = () => setPlaying(!timer);
$("scrub").oninput = (e) => { setPlaying(false); frame = Number(e.target.value); draw(); };
$("speed").onchange = () => { if (timer) setPlaying(true); };
document.addEventListener("keydown", (e) => {
  if (!DATA || document.activeElement.tagName === "INPUT" && document.activeElement.type === "file") return;
  if (e.key === " " && document.activeElement.tagName !== "SELECT") { e.preventDefault(); setPlaying(!timer); }
  else if (e.key === "ArrowRight") { setPlaying(false); frame = Math.min(longest(), frame + 1); draw(); }
  else if (e.key === "ArrowLeft") { setPlaying(false); frame = Math.max(0, frame - 1); draw(); }
});
window.addEventListener("resize", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
